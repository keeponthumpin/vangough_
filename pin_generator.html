<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Fancy Van Gogh - Pin Entry</title>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300..900&display=swap"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
		body {
			background-color: white;
			font-family: 'Dosis', sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
		}
		.container {
			text-align: center;
		}
		#pin-label {
			font-size: 24px;
			margin-bottom: 10px;
			display: block;
		}
		#pin-input {
			width: 120px;
			height: 50px;
			font-size: 48px;
			text-align: center;
			background-color: #f1f1f1;
			border: none;
			border-radius: 5px;
			margin-bottom: 20px;
		}
		#ok-button {
			width: 100px;
			height: 50px;
			font-size: 24px;
			background-color: #4CAF50;
			color: white;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			position: relative;
			top: -10px;
			margin-top: 2px;
		}
		#ok-button:hover {
			background-color: #45a049;
		}
	</style>
</head>
<body>
	<div class="container">
		<label id="pin-label">Your Pin:</label>
		<input id="pin-input" type="text" readonly>
		<button id="ok-button" onclick="location.href='start.html'">OK</button>
	</div>
	<script>
		(() => {
			const pin = Math.floor(1000 + Math.random() * 9000);
			document.getElementById('pin-input').value = pin.toString();
			const socket = new WebSocket('wss://fvg2-dc0b726ecf29.herokuapp.com:443');

			socket.onopen = () => console.log('WebSocket connection opened');
			socket.onmessage = ({ data }) => console.log('Message received:', data);
			socket.onerror = error => console.error('WebSocket error:', error);
			socket.onclose = () => console.log('WebSocket connection closed');

			const sendData = (data) => {
				if (socket.readyState === WebSocket.OPEN) {
					socket.send(JSON.stringify(data));
				} else {
					console.error('WebSocket connection is not open');
				}
			};
			document.querySelector('#ok-button').addEventListener('click', function()
			 {
				localStorage.setItem('pin', pin);
				sendData({ pin });
			});
		})();
	</script>
</body>
</html>
